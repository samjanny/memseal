[package]
name = "memseal"
version = "0.1.6"
edition = "2024"
license = "MIT"
description = "A small password-based encrypted vault for named secrets"
authors = ["Raffaele Mangiacasale <samjanny@gmail.com>"]
keywords = ["encryption", "secrets", "vault", "memory", "security"]
categories = ["cryptography"]
repository = "https://github.com/samjanny/memseal"
documentation = "https://docs.rs/memseal"
readme = "README.md"

[lib]
name = "memseal"
path = "src/lib.rs"


[dependencies]
secrecy = "^0.10"
zeroize = { version = "^1.8", features = ["derive"] }
rand_core = { version = "0.9.3", features = ["os_rng"] }
memsec = "0.7.0"
orion = "0.17.10"
thiserror = "2.0.12"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"


[dev-dependencies]
criterion = "0.5.1"

[[bench]]
name = "full_bench"
harness = false
