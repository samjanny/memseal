[package]
name = "memseal"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A small password-based encrypted vault for named secrets"
authors = ["Raffaele Mangiacasale <samjanny@gmail.com>"]
keywords = ["encryption", "secrets", "vault", "memory", "security"]
categories = ["cryptography"]
repository = "https://github.com/samjanny/memseal"
documentation = "https://docs.rs/memseal"
readme = "README.md"
exclude = ["fuzz/"]

[lib]
name = "memseal"
path = "src/lib.rs"


[dependencies]
zeroize = { version = "^1.8", features = ["derive"] }
getrandom = "0.4.1"
memsec = "0.7.0"
orion = "0.17.16"
thiserror = "2.0.12"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
argon2 = { version = "0.5", default-features = false, features = ["zeroize"] }


[features]
# Exposes the untrusted-input parsers to the fuzz targets in `fuzz/`. Not
# part of the public API; never enable it in a dependency.
fuzzing = []

[dev-dependencies]
criterion = "0.5.1"
tempfile = "3"

[[bench]]
name = "full_bench"
harness = false

# Almost every test derives a key, and an unoptimized Argon2 pass over
# 128 MiB takes seconds. Optimizing the four crates that do that work (the
# two KDF implementations, the BLAKE2b under Argon2id, and the wipe of the
# memory matrix) keeps `cargo test` in the dev profile, with debug
# assertions and overflow checks still on everywhere, at a fraction of the
# time. Profiles only apply to the root package of a build, so this has no
# effect on crates that depend on memseal.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.orion]
opt-level = 3

[profile.dev.package.zeroize]
opt-level = 3
